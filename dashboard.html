<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMMAND CENTER</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030b03;color:#00ff41;font-family:monospace;min-height:100vh;padding:20px}a{color:#00ff41;text-decoration:none}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ff41;padding-bottom:12px;margin-bottom:24px}.header h1{font-size:1.2rem;letter-spacing:3px}.back{border:1px solid #00ff41;padding:6px 14px;font-size:.75rem;letter-spacing:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.card{border:1px solid #00ff41;padding:16px}.stat{font-size:2rem;margin-bottom:4px}.stat-label{font-size:.7rem;color:#6a8e6a;letter-spacing:1px}.section{border:1px solid #00ff41;padding:16px;margin-bottom:16px}.section h2{font-size:.8rem;letter-spacing:2px;margin-bottom:12px}.ti{display:flex;gap:8px;margin-bottom:12px}.ti input{flex:1;background:#000;border:1px solid #00ff41;color:#00ff41;padding:8px;font-family:monospace;font-size:.85rem}.ti input::placeholder{color:#2a5a2a}.ti button{background:transparent;border:1px solid #00ff41;color:#00ff41;padding:8px 16px;font-family:monospace;cursor:pointer}.ti button:hover{background:#00ff41;color:#000}.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #0a2a0a;font-size:.85rem}.task.done span{text-decoration:line-through;color:#2a5a2a}.td{margin-left:auto;background:transparent;border:none;color:#ff4444;cursor:pointer;font-size:1rem}.fb{display:block;width:100%;border:1px solid #00ff41;background:transparent;color:#00ff41;font-family:monospace;font-size:.9rem;letter-spacing:3px;padding:14px;text-align:center;text-decoration:none}.fb:hover{background:#00ff41;color:#000}.blink{animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}</style></head><body><div class="header"><h1>// COMMAND CENTER</h1><a href="/" class="back">NEXUS</a></div><div class="grid"><div class="card"><div class="stat" id="tc">0</div><div class="stat-label">ACTIVE TASKS</div></div><div class="card"><div class="stat" id="dc">0</div><div class="stat-label">COMPLETED</div></div><div class="card"><div class="stat blink" id="cl">--:--</div><div class="stat-label">LOCAL TIME</div></div><div class="card"><div class="stat" id="ds">---</div><div class="stat-label">DATE</div></div></div><div class="section"><h2>// TASK QUEUE</h2><div class="ti"><input type="text" id="ti" placeholder="ADD NEW TASK..." /><button onclick="add()">ADD</button></div><div id="tl"></div></div><a href="/focusflow" class="fb">ENTER FOCUSFLOW</a><script>let t=JSON.parse(localStorage.getItem("nt")||"[]");function sv(){localStorage.setItem("nt",JSON.stringify(t));rn();}function add(){const v=document.getElementById("ti").value.trim();if(!v)return;t.push({id:Date.now(),text:v,done:false});document.getElementById("ti").value="";sv();}function rn(){const l=document.getElementById("tl");l.innerHTML="";t.forEach((x,i)=>{const d=document.createElement("div");d.className="task"+(x.done?" done":"");d.innerHTML=`<input type="checkbox" ${x.done?"checked":""} onchange="tg(${i})"><span>${x.text}</span><button class="td" onclick="dl(${i})">x</button>`;l.appendChild(d);});document.getElementById("tc").textContent=t.filter(x=>!x.done).length;document.getElementById("dc").textContent=t.filter(x=>x.done).length;}function tg(i){t[i].done=!t[i].done;sv();}function dl(i){t.splice(i,1);sv();}function tick(){const n=new Date();document.getElementById("cl").textContent=n.toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit"});document.getElementById("ds").textContent=n.toLocaleDateString("en",{month:"short",day:"numeric"});}document.getElementById("ti").addEventListener("keydown",e=>{if(e.key==="Enter")add();});setInterval(tick,1000);tick();rn();</script></body></html>
