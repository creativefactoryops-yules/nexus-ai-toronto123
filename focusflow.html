<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOCUSFLOW</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030b03;color:#00ff41;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.back{position:fixed;top:16px;left:16px;border:1px solid #00ff41;padding:6px 14px;font-size:.75rem;letter-spacing:2px;color:#00ff41;text-decoration:none}.label{font-size:.75rem;letter-spacing:3px;color:#6a8e6a;margin-bottom:8px}.timer{font-size:5rem;letter-spacing:8px;margin-bottom:8px;line-height:1}.timer-label{font-size:.7rem;letter-spacing:2px;color:#6a8e6a;margin-bottom:32px}.controls{display:flex;gap:12px;margin-bottom:32px}.btn{border:1px solid #00ff41;background:transparent;color:#00ff41;font-family:monospace;font-size:.8rem;letter-spacing:2px;padding:10px 24px;cursor:pointer}.btn:hover,.btn.active{background:#00ff41;color:#000}.presets{display:flex;gap:8px;margin-bottom:32px}.preset{border:1px solid #2a5a2a;background:transparent;color:#6a8e6a;font-family:monospace;font-size:.75rem;padding:6px 14px;cursor:pointer}.preset:hover,.preset.sel{border-color:#00ff41;color:#00ff41}.focus-task{width:min(400px,90vw);background:transparent;border:none;border-bottom:1px solid #00ff41;color:#00ff41;font-family:monospace;font-size:1rem;letter-spacing:2px;text-align:center;padding:8px 0;margin-bottom:32px;outline:none}.focus-task::placeholder{color:#2a5a2a}.reminder{border:1px solid #00ff41;padding:16px 24px;max-width:360px;margin-bottom:24px;font-size:.85rem;letter-spacing:1px;line-height:1.6}.reminder-label{font-size:.65rem;color:#6a8e6a;letter-spacing:2px;margin-bottom:6px}.done-list{list-style:none;color:#2a5a2a;font-size:.8rem;line-height:2;margin-top:12px}.done-list li::before{content:"checkmark "}</style></head><body><a href="/dashboard" class="back">HUB</a><div class="label">// FOCUSFLOW v1.0</div><input class="focus-task" id="ft" placeholder="WHAT ARE YOU WORKING ON?" maxlength="60"><div class="label">SESSION TIMER</div><div class="timer" id="timer">25:00</div><div class="timer-label" id="tl">FOCUS SESSION</div><div class="presets"><button class="preset sel" onclick="setM(25,this)">25m</button><button class="preset" onclick="setM(45,this)">45m</button><button class="preset" onclick="setM(10,this)">10m</button><button class="preset" onclick="setM(5,this)">BREAK</button></div><div class="controls"><button class="btn" id="sb" onclick="tog()">START</button><button class="btn" onclick="rst()">RESET</button></div><div class="reminder"><div class="reminder-label">// REMINDER</div><div id="rm">STAY PRESENT. ONE TASK AT A TIME.</div></div><div class="label">// COMPLETED TODAY</div><ul class="done-list" id="dl"></ul><script>const reminders=["STAY PRESENT. ONE TASK AT A TIME.","YOU GOT THIS. KEEP GOING.","BREATHE. FOCUS. EXECUTE.","SMALL STEPS STILL MOVE FORWARD.","IGNORE THE NOISE. JUST THIS TASK.","PROGRESS OVER PERFECTION.","ONE MORE MINUTE. YOU CAN DO IT."];let mins=25,secs=0,running=false,iv=null,ri=0;function setM(m,el){if(running)return;mins=m;secs=0;upd();document.querySelectorAll(".preset").forEach(b=>b.classList.remove("sel"));el.classList.add("sel");document.getElementById("tl").textContent=m<=5?"BREAK MODE":"FOCUS SESSION";}function upd(){document.getElementById("timer").textContent=String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0");}function tog(){running=!running;const sb=document.getElementById("sb");sb.textContent=running?"PAUSE":"START";sb.classList.toggle("active",running);if(running){iv=setInterval(tick,1000);}else{clearInterval(iv);}}function tick(){if(secs===0){if(mins===0){clearInterval(iv);running=false;document.getElementById("sb").textContent="START";document.getElementById("sb").classList.remove("active");const tx=document.getElementById("ft").value.trim();if(tx){const li=document.createElement("li");li.textContent=tx;document.getElementById("dl").prepend(li);document.getElementById("ft").value="";}alert("SESSION COMPLETE! GREAT WORK.");return;}mins--;secs=59;}else{secs--;}upd();if((mins*60+secs)%60===0){ri=(ri+1)%reminders.length;document.getElementById("rm").textContent=reminders[ri];}}function rst(){clearInterval(iv);running=false;document.getElementById("sb").textContent="START";document.getElementById("sb").classList.remove("active");secs=0;upd();}upd();</script></body></html>
